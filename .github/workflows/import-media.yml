name: import-media
on:
  push:
    paths: ['media-manifest.txt', '.github/workflows/import-media.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg webp
      - name: Download and convert
        run: |
          set -e
          mkdir -p v img _src
          while read -r kind name url opts; do
            [ -z "$kind" ] && continue
            case "$kind" in \#*) continue;; esac
            ext="${url##*.}"
            f="_src/$(basename "$url")"
            [ -f "$f" ] || curl -fsSL "$url" -o "$f"
            if [ "$kind" = img ]; then
              cwebp -quiet -q 80 -resize ${opts:-1600} 0 "$f" -o "img/$name.webp"
            else
              # opts = width:crf
              w="${opts%%:*}"; crf="${opts##*:}"
              ffmpeg -loglevel error -y -i "$f" -an -vf "scale='min($w,iw)':-2" -c:v libx264 -preset slow -crf "$crf" -pix_fmt yuv420p -movflags +faststart "v/$name.mp4"
              ffmpeg -loglevel error -y -i "v/$name.mp4" -frames:v 1 -vf "scale='min(1280,iw)':-2" -q:v 4 "_src/$name.jpg"
              cwebp -quiet -q 75 "_src/$name.jpg" -o "v/$name.webp"
            fi
          done < media-manifest.txt
          rm -rf _src
          ls -la v img
      - name: Commit
        run: |
          git config user.name "designlabs-bot"
          git config user.email "designlabs-bot@users.noreply.github.com"
          git add v img
          git diff --cached --quiet || git commit -m "Import optimized media from manifest"
          git push
