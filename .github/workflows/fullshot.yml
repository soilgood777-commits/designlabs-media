name: fullshot
on:
  push:
    paths: ['shot-manifest.txt', '.github/workflows/fullshot.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install
        run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Shoot
        run: |
          cat > shot.js <<'JS'
          const {chromium}=require('playwright');const fs=require('fs');
          (async()=>{const b=await chromium.launch();
          for(const line of fs.readFileSync('shot-manifest.txt','utf8').split('\n')){
            const [name,url,w,h,mobile]=line.trim().split(/\s+/); if(!name||name.startsWith('#'))continue;
            const ctx=await b.newContext({viewport:{width:+w,height:+h},deviceScaleFactor:mobile==='m'?3:1,isMobile:mobile==='m',hasTouch:mobile==='m',locale:'ko-KR'});
            const p=await ctx.newPage(); await p.goto(url,{waitUntil:'networkidle',timeout:90000}).catch(()=>{});
            await p.waitForTimeout(3000);
            const H=await p.evaluate(()=>document.documentElement.scrollHeight);
            for(let y=0;y<H;y+=400){await p.evaluate(y=>window.scrollTo(0,y),y);await p.waitForTimeout(350)}
            await p.evaluate(()=>window.scrollTo(0,0)); await p.waitForTimeout(2500);
            await p.screenshot({path:`shots/${name}.png`,fullPage:true});
            console.log(name,H); await ctx.close();}
          await b.close()})();
          JS
          mkdir -p shots && node shot.js && ls -la shots
      - name: Commit
        run: |
          git config user.name "designlabs-bot"
          git config user.email "designlabs-bot@users.noreply.github.com"
          git add shots
          git diff --cached --quiet || git commit -m "Full-page screenshots"
          git push
