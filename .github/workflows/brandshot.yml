name: brandshot
on:
  push:
    paths: ['brand-manifest.txt', '.github/workflows/brandshot.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install
        run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Shoot
        run: |
          cat > bshot.js <<'JS'
          const {chromium}=require('playwright');const fs=require('fs');
          (async()=>{const b=await chromium.launch({channel:'chrome'});
          for(const line of fs.readFileSync('brand-manifest.txt','utf8').split('\n')){
            const [name,url,wait]=line.trim().split(/\s+/); if(!name||name.startsWith('#'))continue;
            try{
            const ctx=await b.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:2,locale:'ko-KR'});
            const p=await ctx.newPage(); await p.goto(url,{waitUntil:'networkidle',timeout:90000}).catch(()=>{});
            await p.waitForTimeout(3000);
            for(let y=0;y<4000;y+=500){await p.evaluate(y=>window.scrollTo(0,y),y);await p.waitForTimeout(200)}
            await p.evaluate(()=>window.scrollTo(0,0)); await p.waitForTimeout(+(wait||5000));
            // kill imweb banner
            await p.evaluate(()=>{document.querySelectorAll('body *').forEach(e=>{if(/아임웹으로 제작/.test(e.textContent||'')&&e.children.length<12){let f=e;while(f&&f!==document.body){const cs=getComputedStyle(f);if(cs.position==='fixed'||cs.position==='sticky'){f.style.setProperty('display','none','important');break}f=f.parentElement}}})});
            // 1) logo: top-left link/img in first 160px
            const logoBox=await p.evaluate(()=>{
              const W=innerWidth; const cand=[];
              const all=[];(function walk(r){r.querySelectorAll('*').forEach(e=>{all.push(e);if(e.shadowRoot)walk(e.shadowRoot)})})(document);
              for(const e of all){const t=e.tagName; if(!(t==='IMG'||t==='svg'||t==='A'||t==='H1'||t==='DIV'||t==='SPAN'))continue;
                const r=e.getBoundingClientRect(); if(r.width<40||r.height<14||r.top<0||r.bottom>150||r.left>W*0.42||r.width>W*0.35||r.height>110)continue;
                const cs=getComputedStyle(e); if(cs.visibility==='hidden'||+cs.opacity<0.1)continue;
                let s=0; const href=(e.closest('a')||{}).getAttribute?.('href')||'';
                if(/^(\/|\/index|https?:\/\/[^\/]+\/?)$/.test(href)||/logo/i.test(e.className+' '+(e.id||'')+' '+(e.alt||'')))s+=5;
                if(t==='IMG'||t==='svg')s+=2; if(t==='A')s+=3; s-=r.left/400;
                cand.push([s,r.x,r.y,r.width,r.height,t,(e.className+'').slice(0,40)]);}
              cand.sort((a,b)=>b[0]-a[0]); return cand.slice(0,5);});
            console.log(name,'logo cand',JSON.stringify(logoBox));
            if(logoBox.length){const [s,x,y,w,h]=logoBox[0]; await p.screenshot({path:`bshots/${name}_logo.png`,clip:{x:Math.max(0,x-6),y:Math.max(0,y-6),width:w+12,height:h+12}});}
            // 2) clean hero: hide text, header bars, buttons, small imgs
            await p.evaluate(()=>{
              const st=document.createElement('style'); st.textContent='*{color:transparent!important;text-shadow:none!important;-webkit-text-stroke:0 transparent!important;caret-color:transparent!important}svg{visibility:hidden!important}a,button,input,select,textarea,label{background-color:transparent!important;border-color:transparent!important;box-shadow:none!important;background-image:none!important}::before,::after{border-color:transparent!important}';
              document.head.appendChild(st);
              const W=innerWidth,H=innerHeight; const all=[];(function walk(r){r.querySelectorAll('*').forEach(e=>{all.push(e);if(e.shadowRoot){const s2=st.cloneNode(true);e.shadowRoot.appendChild(s2);walk(e.shadowRoot)}})})(document);
              for(const e of all){const r=e.getBoundingClientRect(); const cs=getComputedStyle(e);
                if((cs.position==='fixed'||cs.position==='sticky'||cs.position==='absolute')&&r.top<130&&r.height<170&&r.width>W*0.5){e.style.setProperty('visibility','hidden','important');continue}
                if((cs.position==='fixed')&&r.width<W*0.5){e.style.setProperty('visibility','hidden','important');continue}
                if(e.tagName==='IMG'&&r.width<W*0.3&&r.height<H*0.3)e.style.setProperty('visibility','hidden','important');
                if(r.width<W*0.4&&r.height<120&&cs.backgroundColor!=='rgba(0, 0, 0, 0)'&&r.top<H)e.style.setProperty('background-color','transparent','important');
              }});
            await p.waitForTimeout(800);
            await p.screenshot({path:`bshots/${name}_bg.png`});
            await ctx.close();}catch(err){console.log(name,'ERR',err.message)}}
          await b.close()})();
          JS
          mkdir -p bshots && node bshot.js && ls -la bshots
      - name: Commit
        run: |
          git config user.name "designlabs-bot"
          git config user.email "designlabs-bot@users.noreply.github.com"
          git add bshots
          git diff --cached --quiet || git commit -m "Brand hero/logo shots"
          git pull --rebase -q || true
          git push
