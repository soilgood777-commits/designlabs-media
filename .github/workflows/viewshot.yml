name: viewshot
on:
  push:
    paths: ['view-manifest.txt', '.github/workflows/viewshot.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install
        run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Shoot
        run: |
          cat > vshot.js <<'JS'
          const {chromium}=require('playwright');const fs=require('fs');
          (async()=>{const b=await chromium.launch();
          for(const line of fs.readFileSync('view-manifest.txt','utf8').split('\n')){
            const [name,url,w,h,mobile,wait]=line.trim().split(/\s+/); if(!name||name.startsWith('#'))continue;
            const ctx=await b.newContext({viewport:{width:+w,height:+h},deviceScaleFactor:2,isMobile:mobile==='m',hasTouch:mobile==='m',locale:'ko-KR'});
            const p=await ctx.newPage(); await p.goto(url,{waitUntil:'networkidle',timeout:90000}).catch(()=>{});
            await p.waitForTimeout(3000);
            const H=await p.evaluate(()=>document.documentElement.scrollHeight);
            for(let y=0;y<Math.min(H,6000);y+=500){await p.evaluate(y=>window.scrollTo(0,y),y);await p.waitForTimeout(250)}
            await p.evaluate(()=>window.scrollTo(0,0)); await p.waitForTimeout(+(wait||4000));
            await p.screenshot({path:`vshots/${name}.png`});
            console.log(name,H); await ctx.close();}
          await b.close()})();
          JS
          mkdir -p vshots && node vshot.js && ls -la vshots
      - name: Commit
        run: |
          git config user.name "designlabs-bot"
          git config user.email "designlabs-bot@users.noreply.github.com"
          git add vshots
          git diff --cached --quiet || git commit -m "Viewport screenshots"
          git pull --rebase -q || true
          git push
